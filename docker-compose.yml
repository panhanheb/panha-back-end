# Production-like stack: MySQL 8 + the shop web application.
#   cp .env.example .env   (then edit the values)
#   docker compose up -d --build
services:
  mysql:
    image: mysql:8.4
    container_name: ecommerce-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      # Creates the schema on the first start of an empty volume
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Uncomment to reach MySQL from MySQL Workbench on the host
    # ports:
    #   - "3306:3306"

  web:
    build: .
    image: nhacg1
    container_name: nhacg1
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USE_SSL: "false"
      DB_ALLOW_PUBLIC_KEY_RETRIEVAL: "true"
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:8080/reset-password}
      # The session cookie is HTTPS-only in prod. Keep false while the site is served over plain
      # http://localhost; set true once it sits behind an HTTPS reverse proxy.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SHOP_CURRENCY: ${SHOP_CURRENCY:-USD}
      SHOP_SHIPPING_FEE: ${SHOP_SHIPPING_FEE:-2.00}
      SHOP_FREE_SHIPPING_THRESHOLD: ${SHOP_FREE_SHIPPING_THRESHOLD:-50.00}
    ports:
      - "8080:8080"
volumes:
  mysql-data:
