# Local / production-like stack: PostgreSQL, Redis, S3-compatible storage (RustFS) and the API.
#   cp .env.example .env      (change the passwords; the defaults below are for local use only)
#   docker compose up -d --build
#   docker compose logs -f api
# PostgreSQL (5433) and Redis (6379) are published on localhost only, so the API can also run from the IDE:
#   docker compose up -d postgres redis storage   then run EcommerceApplication with the dev profile.
services:
  postgres:
    image: postgres:17-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ecommerce_db}
      POSTGRES_USER: ${DB_USERNAME:-ecommerce}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ecommerce-local}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # For running the API from the IDE: localhost only, 5433 so it does not clash with a local PostgreSQL
    ports:
      - "127.0.0.1:5433:5432"
  # S3-compatible object storage for product images. AWS S3 replaces it in production.
  storage:
    image: rustfs/rustfs:1.0.3
    container_name: ecommerce-storage
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-ecommerce}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-ecommerce-local-secret}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - storage-data:/data
    # Port 9000 must be reachable by clients that load images (S3_PUBLIC_BASE_URL); 9001 is the web console
    ports:
      - "9000:9000"
  api:
    build: .
    image: nhacg1
    container_name: nhacg1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ecommerce_db}
      DB_USERNAME: ${DB_USERNAME:-ecommerce}
      DB_PASSWORD: ${DB_PASSWORD:-ecommerce-local}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-local}
      S3_ENDPOINT: http://storage:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-ecommerce-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ecommerce}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-ecommerce-local-secret}
      S3_PATH_STYLE: "true"
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/ecommerce-media}
      S3_CREATE_BUCKET: "true"
      # Local default only. Real deployments: openssl rand -base64 64
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktZWNvbW1lcmNlLWp3dC1zZWNyZXQtY2hhbmdlLW1lLWluLWV2ZXJ5LXJlYWwtZW52aXJvbm1lbnQ=}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shop.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:3000/reset-password}
      SHOP_CURRENCY: ${SHOP_CURRENCY:-USD}
      SHOP_SHIPPING_FEE: ${SHOP_SHIPPING_FEE:-2.00}
      SHOP_FREE_SHIPPING_THRESHOLD: ${SHOP_FREE_SHIPPING_THRESHOLD:-50.00}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  redis-data:
  storage-data:
