# Production profile - every secret MUST come from the environment
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=${DB_USE_SSL:true}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.bootstrap.admin-password=${ADMIN_PASSWORD}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
spring.devtools.restart.enabled=false
logging.level.org.example.panhabackend=INFO
server.shutdown=graceful
