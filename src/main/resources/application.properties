# ===================================================================
# School Attendance Management System - common configuration
# ===================================================================
spring.application.name=school-attendance-system
spring.profiles.default=dev
server.port=${SERVER_PORT:8080}

# ---------- MySQL 8 ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:school_attendance_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=AttendanceHikariPool

# ---------- JPA / Hibernate ----------
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.show-sql=false

# ---------- Jackson ----------
spring.jackson.time-zone=UTC

# ---------- Pagination ----------
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ---------- Error responses (handled by GlobalExceptionHandler) ----------
server.error.include-stacktrace=never
server.error.include-message=never

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---------- OpenAPI / Swagger ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json

# ---------- Application ----------
# Base64-encoded HMAC key (>= 256 bits). ALWAYS override JWT_SECRET outside development.
app.jwt.secret=${JWT_SECRET:c2Nob29sLWF0dGVuZGFuY2UtZGV2LXNlY3JldC1rZXktY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tMjAyNg==}
app.jwt.access-token-expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES:60}
app.jwt.refresh-token-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}
app.jwt.issuer=school-attendance-system

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}

# Count LATE as attended when calculating the attendance percentage
app.attendance.count-late-as-present=true
# Number of days after the session date during which a teacher may still edit attendance
app.attendance.teacher-edit-window-days=7

app.password-reset.token-expiration-minutes=30
app.password-reset.reset-url=${PASSWORD_RESET_URL:http://localhost:3000/reset-password}

# Default administrator created on first startup (when no admin exists)
app.bootstrap.admin-username=${ADMIN_USERNAME:admin}
app.bootstrap.admin-email=${ADMIN_EMAIL:admin@school.local}
app.bootstrap.admin-password=${ADMIN_PASSWORD:Admin@123}

# ---------- Logging ----------
logging.level.root=INFO
logging.level.org.example.panhabackend=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15.15t] %-40.40logger{39} : %m%n
